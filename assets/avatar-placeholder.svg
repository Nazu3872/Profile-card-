<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)" />
  
  <!-- Subtle pattern grid -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Developer Monogram / Icon Avatar -->
  <g fill="none" stroke="url(#avatarGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Code brackets -->
    <path d="M 62 82 L 42 100 L 62 118" />
    <path d="M 138 82 L 158 100 L 138 118" />
    <!-- Center Developer Stylized Head/Shoulders -->
  </g>
  <circle cx="100" cy="85" r="24" fill="url(#avatarGlow)" opacity="0.9" />
  <path d="M 64 145 C 64 122 80 115 100 115 C 120 115 136 122 136 145" fill="url(#avatarGlow)" opacity="0.9" />
  
  <!-- Sparkles -->
  <circle cx="145" cy="55" r="3" fill="#a78bfa" />
  <circle cx="55" cy="60" r="2.5" fill="#818cf8" />
  <circle cx="150" cy="140" r="2" fill="#c084fc" />
</svg>

